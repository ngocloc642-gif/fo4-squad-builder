<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Cầu Thủ - FO4PLAYERS</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #fff; }
        .admin-container { max-width: 1200px; margin: 30px auto; padding: 20px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .admin-header h2 { margin: 0; color: #ffc107; }
        .btn-back { background: #6c757d; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-back:hover { background: #5a6268; }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 6px; }
        .box h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #181818; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background: #218838; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; }
        th { background: #333; color: #ffd700; }
        td img { width: 40px; border-radius: 4px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-del:hover { background: #c82333; }
        /* ===== CSS CHO DROPDOWN MÙA THẺ ===== */
        .custom-select { position: relative; width: 100%; }
        .select-selected { background-color: #181818; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; }
        .select-selected img { margin-right: 10px; }
        .select-selected:after { content: "▼"; position: absolute; right: 10px; font-size: 12px; color: #888; }
        .select-items { position: absolute; background-color: #2a2a2a; border: 1px solid #444; top: 100%; left: 0; right: 0; z-index: 99; max-height: 200px; overflow-y: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .select-hide { display: none; }
        .select-items div { color: #fff; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; border-bottom: 1px solid #333; }
        .select-items div img { margin-right: 10px; }
        .select-items div:hover { background-color: #333; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h2>⚙️ BẢNG ĐIỀU KHIỂN ADMIN</h2>
        <a href="index.html" class="btn-back">⬅️ Về trang chủ</a>
    </div>

    <div class="admin-grid">
        <!-- Cột trái: Form thêm dữ liệu -->
        <div class="box">
            <h3 style="color: #00ffcc;">➕ Thêm Cầu Thủ Mới</h3>
            <form id="admin-form">
                <!-- ID ẩn dùng để nhận diện khi nào là Thêm, khi nào là Sửa -->
                <input type="hidden" id="a-id">
                
                <div class="form-group">
                    <label>Tên cầu thủ:</label>
                    <input type="text" id="a-name" required placeholder="Ví dụ: Ronaldo">
                </div>

                <div class="form-group">
                    <label>Mùa thẻ:</label>
                    <div class="custom-select" id="season-selector">
                        <div class="select-selected">
                            <span id="selected-season-text">Chọn mùa thẻ</span>
                        </div>
                        <div class="select-items select-hide"></div>
                    </div>
                    <input type="hidden" id="a-season" required>
                </div>

                <div class="form-group">
                    <label>Vị trí:</label>
                    <div class="custom-select" id="pos-selector">
                        <div class="select-selected">
                            <span id="selected-pos-text">Chọn vị trí</span>
                        </div>
                        <div class="select-items select-hide">
                            <div data-value="ST">ST</div>
                            <div data-value="CF">CF</div>
                            <div data-value="LW">LW</div>
                            <div data-value="RW">RW</div>
                            <div data-value="CM">CM</div>
                            <div data-value="CAM">CAM</div>
                            <div data-value="CDM">CDM</div>
                            <div data-value="LM">LM</div>
                            <div data-value="RM">RM</div>
                            <div data-value="CB">CB</div>
                            <div data-value="RB">RB</div>
                            <div data-value="LB">LB</div>
                            <div data-value="RWB">RWB</div>
                            <div data-value="LWB">LWB</div>
                            <div data-value="GK">GK</div>
                        </div>
                    </div>
                    <input type="hidden" id="a-pos" required>
                </div>

                <div class="form-group">
                    <label>Chỉ số OVR:</label>
                    <input type="number" id="a-ovr" required placeholder="Ví dụ: 108">
                </div>
                
                <div class="form-group">
                    <label>Lương:</label>
                    <input type="number" id="a-salary" required placeholder="Ví dụ: 27">
                </div>
                
                <div class="form-group">
                    <label>Giá tiền (VNĐ):</label>
                    <input type="number" id="a-price" required placeholder="Ví dụ: 25000000000">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="btn-save" class="btn-submit">➕ Thêm Cầu Thủ</button>
                    <button type="button" id="btn-cancel" class="btn-submit" style="display: none; background: #6c757d;" onclick="cancelEdit()">Hủy</button>
                </div>
            </form>
        </div>

        <!-- Cột phải: Bảng danh sách -->
        <div class="box">
            <h3 style="color: #ffd700;">📋 Danh Sách Cầu Thủ</h3>
            <table>
                <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Mùa</th>
                        <th>Vị trí</th>
                        <th>OVR</th>
                        <th>Lương</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Dữ liệu mẫu test giao diện, lát nữa JS sẽ tự đổ dữ liệu thật vào đây -->
                    <tr>
                        <td><strong>Ronaldo</strong></td>
                        <td>ICON</td>
                        <td>ST</td>
                        <td style="color:#ffd700; font-weight:bold;">108</td>
                        <td>27</td>
                        <td><button class="btn-del">Xóa</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="seasons.js"></script>
<script src="admin.js"></script>
</body>
</html>
