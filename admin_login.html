<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Quản Trị Viên</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); text-align: center; border-top: 4px solid #dc3545; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; margin-top: 10px; }
        button:hover { background: #c82333; }
        .back-link { display: block; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="margin-top: 0;">🔐 ADMIN LOGIN</h2>
        <p style="color: #888; font-size: 14px;">Vui lòng nhập thông tin xác thực</p>
        
        <form id="admin-login-form">
            <input type="text" id="admin-user" placeholder="Tên đăng nhập Admin" required>
            <input type="password" id="admin-pass" placeholder="Mật khẩu" required>
            <button type="submit">ĐĂNG NHẬP HỆ THỐNG</button>
        </form>
        
        <a href="index.html" class="back-link">Quay lại trang chủ</a>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            try {
                // Gọi API login hiện tại của bạn
                const res = await fetch('login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    // Kiểm tra xem có đúng là Admin không
                    if (data.role === 'admin' || data.role === 1) {
                        localStorage.setItem('admin_logged_in', 'true'); // Lưu trạng thái
                        window.location.href = 'admin.html'; // Đẩy vào Admin
                    } else {
                        alert("❌ Tài khoản này không có quyền Admin!");
                    }
                } else {
                    alert("❌ Sai tài khoản hoặc mật khẩu!");
                }
            } catch (err) {
                alert("Lỗi kết nối đến server!");
            }
        });
    </script>
</body>
</html>
